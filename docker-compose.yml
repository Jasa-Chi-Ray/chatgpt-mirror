services:
  chatgpt-mirror:
    image: ${GATEWAY_IMAGE:-lisa666520/chatgpt-mirror:latest}
    pull_policy: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-40002}:${PORT:-40002}"
    volumes:
      - ./data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-40002}"
      TZ: "${TZ:-Asia/Shanghai}"
      NO_PROXY: "localhost,127.0.0.1,django,chatgpt-mirror,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,chatgpt-mirror,cfbypass"
      DATABASE_PATH: "/app/data/chatgpt_mirror.db"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?请设置 GATEWAY_ADMIN_SECRET}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?请设置 CREDENTIAL_ENCRYPTION_KEY}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      LOCAL_NETWORK_ACCESS: "${LOCAL_NETWORK_ACCESS:-enable}"
      MIRROR_API_PREFIX: "${MIRROR_API_PREFIX:-}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"
      FREE_ACCOUNT_USERNAME: "${FREE_ACCOUNT_USERNAME:-free_account}"
      ADMIN_UPSTREAM: "${ADMIN_UPSTREAM:-}"
      DJANGO_UPSTREAM: "http://django:8000"
      CHATGPT_BASE_URL: "${CHATGPT_BASE_URL:-https://chatgpt.com}"
      CHATGPT_CDN_BASE_URL: "${CHATGPT_CDN_BASE_URL:-https://cdn.oaistatic.com}"
      CHATGPT_AB_BASE_URL: "${CHATGPT_AB_BASE_URL:-https://ab.chatgpt.com}"
      CF_BYPASS_URL: "http://cfbypass:8000"
      CF_BYPASS_PROXY_SERVER: "${CF_BYPASS_PROXY_SERVER:-}"
      REQUEST_TIMEOUT_SECS: "${REQUEST_TIMEOUT_SECS:-180}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      CURL_IMPERSONATE: "${CURL_IMPERSONATE_PROFILE:-chrome146}"
      CURL_IMPERSONATE_HEADERS: "no"
      RUST_LOG: "${RUST_LOG:-warn}"
    depends_on:
      django:
        condition: service_healthy
      cfbypass:
        condition: service_started
    restart: unless-stopped
    networks:
      - chatgpt-network

  django:
    image: ${BACKEND_IMAGE:-lisa666520/chatgpt-mirror:backend}
    pull_policy: always
    expose:
      - "8000"
    environment:
      DJANGO_ENV: "PRODUCTION"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      LOCAL_NETWORK_ACCESS: "${LOCAL_NETWORK_ACCESS:-enable}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?请设置 DJANGO_SECRET_KEY}"
      DJANGO_ALLOW_ALL_ORIGINS: "${DJANGO_ALLOW_ALL_ORIGINS:-disable}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-django,localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-true}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-true}"
      SHOW_GITHUB: "${SHOW_GITHUB:-true}"
      NO_PROXY: "localhost,127.0.0.1,django,chatgpt-mirror,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,chatgpt-mirror,cfbypass"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?请设置 GATEWAY_ADMIN_SECRET}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?请设置 CREDENTIAL_ENCRYPTION_KEY}"
      API_TOKEN_TTL_SECONDS: "${API_TOKEN_TTL_SECONDS:-604800}"
      GATEWAY_CONNECT_TIMEOUT_SECONDS: "${GATEWAY_CONNECT_TIMEOUT_SECONDS:-5}"
      GATEWAY_READ_TIMEOUT_SECONDS: "${GATEWAY_READ_TIMEOUT_SECONDS:-60}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"
      FREE_ACCOUNT_USERNAME: "${FREE_ACCOUNT_USERNAME:-free_account}"
      CHATGPT_GATEWAY_URL: "http://chatgpt-mirror:${PORT:-40002}"
      CLOUDFLARE_TURNSTILE: "${CLOUDFLARE_TURNSTILE:-disable}"
      CLOUDFLARE_TURNSTILE_SITE_KEY: "${CLOUDFLARE_TURNSTILE_SITE_KEY:-}"
      CLOUDFLARE_TURNSTILE_SECRET_KEY: "${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}"
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/db:/app/backend/db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/0x/user/version-cfg', headers={'X-Mirror-Healthcheck': '1', 'X-Gateway-Secret': os.environ['GATEWAY_ADMIN_SECRET']}), timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - chatgpt-network

  cfbypass:
    image: ${CFBYPASS_IMAGE:-lisa666520/chatgpt-mirror:cfbypass}
    pull_policy: always
    expose:
      - "8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CF_BYPASS_USER_AGENT: "${CF_BYPASS_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36}"
      CF_BYPASS_ACCEPT_LANGUAGE: "${CF_BYPASS_ACCEPT_LANGUAGE:-zh-CN,zh}"
      CF_BYPASS_BROWSER_IDLE_SECONDS: "${CF_BYPASS_BROWSER_IDLE_SECONDS:-30}"
      CF_BYPASS_MAX_WAIT_SECONDS: "${CF_BYPASS_MAX_WAIT_SECONDS:-20}"
      CF_BYPASS_SECRET: "${GATEWAY_ADMIN_SECRET:?请设置 GATEWAY_ADMIN_SECRET}"
      CF_BYPASS_ALLOWED_HOSTS: "${CF_BYPASS_ALLOWED_HOSTS:-chatgpt.com,.chatgpt.com}"
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - chatgpt-network

networks:
  chatgpt-network:
    driver: bridge
