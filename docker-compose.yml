services:
  chatgpt-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-40002}:${PORT:-40002}"
    volumes:
      - ./data:/app/data
    environment:
      # 服务器配置
      - HOST=0.0.0.0
      - PORT=${PORT:-40002}
      - TZ=${TZ:-Asia/Shanghai}
      - NO_PROXY=localhost,127.0.0.1,django,chatgpt-mirror,cfbypass
      - no_proxy=localhost,127.0.0.1,django,chatgpt-mirror,cfbypass
      # 数据库配置
      - DATABASE_PATH=/app/data/chatgpt_mirror.db
      # 管理员配置
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - GATEWAY_ADMIN_SECRET=${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - MIRROR_API_PREFIX=${MIRROR_API_PREFIX:-}
      # 用户注册配置
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      - FREE_ACCOUNT_USERNAME=${FREE_ACCOUNT_USERNAME:-free_account}
      # 站点层上游
      - ADMIN_UPSTREAM=${ADMIN_UPSTREAM:-}
      - DJANGO_UPSTREAM=http://django:8000
      # ChatGPT API 配置
      - CHATGPT_BASE_URL=${CHATGPT_BASE_URL:-https://chatgpt.com}
      - CHATGPT_CDN_BASE_URL=${CHATGPT_CDN_BASE_URL:-https://cdn.oaistatic.com}
      - CHATGPT_AB_BASE_URL=${CHATGPT_AB_BASE_URL:-https://ab.chatgpt.com}
      # CloudFlare5sBypass 配置（使用 Docker 服务名作为主机名）
      - CF_BYPASS_URL=http://cfbypass:8000
      - CF_BYPASS_PROXY_SERVER=${CF_BYPASS_PROXY_SERVER:-}
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-180}
      - CURL_IMPERSONATE=${CURL_IMPERSONATE_PROFILE:-chrome146}
      - CURL_IMPERSONATE_HEADERS=no
      # Rust 日志级别
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      cfbypass:
        condition: service_started
      django:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatgpt-network

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      - DJANGO_ENV=PRODUCTION
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_ALLOW_ALL_ORIGINS=${DJANGO_ALLOW_ALL_ORIGINS:-disable}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-django,localhost,127.0.0.1}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT:-false}
      - DJANGO_SESSION_COOKIE_SECURE=${DJANGO_SESSION_COOKIE_SECURE:-true}
      - DJANGO_CSRF_COOKIE_SECURE=${DJANGO_CSRF_COOKIE_SECURE:-true}
      - SHOW_GITHUB=${SHOW_GITHUB:-true}
      - NO_PROXY=localhost,127.0.0.1,django,chatgpt-mirror,cfbypass
      - no_proxy=localhost,127.0.0.1,django,chatgpt-mirror,cfbypass
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - GATEWAY_ADMIN_SECRET=${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      - FREE_ACCOUNT_USERNAME=${FREE_ACCOUNT_USERNAME:-free_account}
      - API_TOKEN_TTL_SECONDS=${API_TOKEN_TTL_SECONDS:-604800}
      - CLOUDFLARE_TURNSTILE=${CLOUDFLARE_TURNSTILE:-disable}
      - CLOUDFLARE_TURNSTILE_SITE_KEY=${CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      - CHATGPT_GATEWAY_URL=http://chatgpt-mirror:${PORT:-40002}
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/db:/app/backend/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/0x/user/version-cfg', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - chatgpt-network

  # CloudFlare5sBypass 服务（可选，用于绕过 Cloudflare 5s 盾）
  cfbypass:
    build:
      context: .
      dockerfile: cfbypass/Dockerfile
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CF_BYPASS_USER_AGENT=${CF_BYPASS_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36}
      - CF_BYPASS_ACCEPT_LANGUAGE=${CF_BYPASS_ACCEPT_LANGUAGE:-zh-CN,zh}
      - CF_BYPASS_HEADLESS=${CF_BYPASS_HEADLESS:-true}
      - CF_BYPASS_MAX_WAIT_SECONDS=${CF_BYPASS_MAX_WAIT_SECONDS:-20}
      - CF_BYPASS_PAGE_LOAD_TIMEOUT_SECONDS=${CF_BYPASS_PAGE_LOAD_TIMEOUT_SECONDS:-15}
      - CF_BYPASS_FIRST_COOKIE_WAIT_SECONDS=${CF_BYPASS_FIRST_COOKIE_WAIT_SECONDS:-6}
      - CF_BYPASS_POLL_INTERVAL_SECONDS=${CF_BYPASS_POLL_INTERVAL_SECONDS:-0.5}
      - CF_BYPASS_COOKIE_STABLE_POLLS=${CF_BYPASS_COOKIE_STABLE_POLLS:-2}
      - CF_BYPASS_NAVIGATION_RETRIES=${CF_BYPASS_NAVIGATION_RETRIES:-1}
      - CF_BYPASS_ELEMENT_LOOKUP_TIMEOUT_SECONDS=${CF_BYPASS_ELEMENT_LOOKUP_TIMEOUT_SECONDS:-0.2}
      - CF_BYPASS_DISPLAY_SIZE=${CF_BYPASS_DISPLAY_SIZE:-1920x1080}
      - CF_BYPASS_SECRET=${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}
      - CF_BYPASS_ALLOWED_HOSTS=${CF_BYPASS_ALLOWED_HOSTS:-chatgpt.com,.chatgpt.com}
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - chatgpt-network
    # 如果不需要 CF Bypass 功能，可以注释掉此服务

networks:
  chatgpt-network:
    driver: bridge
